[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hrvpp-recon"
version = "1.0.0"
description = "Reconstruct and validate missing Copernicus HR-VPP phenology tiles from Sentinel-2"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24", "pandas>=1.5", "rasterio>=1.3", "requests>=2.28", "scikit-learn>=1.2",
]

[project.optional-dependencies]
ee = ["earthengine-api>=0.1.390"]
wekeo = ["hda>=2.0"]
local = ["pystac-client>=0.7", "planetary-computer>=1.0"]
gpu = ["cupy-cuda12x>=13"]
dev = ["pytest>=7", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
